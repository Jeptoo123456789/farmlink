services:
  - type: web
    name: farmlink
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && node -e "if (!require('node:fs').existsSync('dist/index.html')) { console.error('Build failed: dist/index.html was not generated'); process.exit(1); }"
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true